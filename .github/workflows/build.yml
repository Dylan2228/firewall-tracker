name: Build Multi-Platform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: firewall_tracker.exe
            asset_name: firewall_tracker-windows.exe
          - os: macos-latest
            artifact_name: Firewall-Tracker-macOS.zip
            asset_name: Firewall-Tracker-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller darkdetect

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter firewall_tracker.py

      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconsole --windowed --onefile --collect-all customtkinter --name "Firewall Tracker" firewall_tracker.py
          cd dist
          zip -r "Firewall-Tracker-macOS.zip" "Firewall Tracker.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
