name: Build Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: firewall_tracker.exe
            asset_name: firewall_tracker-windows.exe
          - os: macos-latest
            artifact_name: Firewall-Tracker.dmg
            asset_name: Firewall-Tracker.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --noupx --version-file=version_info.txt --collect-all customtkinter firewall_tracker.py

      - name: Build macOS App & DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconsole --windowed --onefile --noupx --osx-bundle-identifier "com.dylan.firewalltracker" --collect-all customtkinter --name "Firewall Tracker" firewall_tracker.py
          codesign --force --deep --sign - "dist/Firewall Tracker.app"
          mkdir -p dist/dmg_root
          cp -R "dist/Firewall Tracker.app" dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          rm -f "dist/Firewall-Tracker.dmg"
          hdiutil create -volname "Firewall Tracker" -srcfolder dist/dmg_root -ov -format UDZO "dist/Firewall-Tracker.dmg"
          rm -rf dist/dmg_root
          cd dist
          zip -r "Firewall-Tracker-macOS.zip" "Firewall Tracker.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload macOS Zip (macOS only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Firewall-Tracker-macOS.zip
          path: dist/Firewall-Tracker-macOS.zip

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
